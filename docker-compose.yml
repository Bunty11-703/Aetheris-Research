version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aetheris-postgres
    environment:
      POSTGRES_USER: aetheris_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aetheris_secure_password}
      POSTGRES_DB: aetheris_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetheris_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aetheris-network

  # Backend API Server (Node.js)
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: aetheris-backend
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://aetheris_user:${DB_PASSWORD:-aetheris_secure_password}@postgres:5432/aetheris_db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aetheris-network
    command: npm run dev

  # Frontend Application (Next.js)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: aetheris-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aetheris-network
    command: npm run dev

  # Redis for Caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: aetheris-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aetheris-network
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:

networks:
  aetheris-network:
    driver: bridge
